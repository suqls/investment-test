<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투자 성향 테스트</title>
<meta name="description" content="질문 10개로 안정·균형·성장·모험 추구 성향을 알아보는 학생용 투자 성향 테스트">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 단독 실행용 기본 설정 */
[hidden] { display: none !important; }
html { color-scheme: light; }
body { margin: 0; }

/* Layout: 노트북·태블릿(가로) 기준 넓은 2단 구성. 시작은 좌 글/우 게이지, 문제는 보기 3칸 카드, 결과는 좌 성향/우 특징·상품. 900px 아래에서는 한 줄로 쌓임. */
:root {
  --bg: #F2F5F9;
  --surface: #FFFFFF;
  --fg: #14233A;
  --muted: #566782;
  --line: #D5DDE9;
  --accent: #14233A;
  --accent-fg: #FFFFFF;
  --c-safe: #2E6FD9;
  --c-balance: #16977F;
  --c-growth: #E09A12;
  --c-bold: #DB4A27;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1726;
    --surface: #16233A;
    --fg: #E8EEF8;
    --muted: #9BAAC2;
    --line: #2A3A55;
    --accent: #E8EEF8;
    --accent-fg: #0E1726;
    --c-safe: #6FA2FF;
    --c-balance: #3CCBAF;
    --c-growth: #F2B544;
    --c-bold: #FF7A55;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1726;
  --surface: #16233A;
  --fg: #E8EEF8;
  --muted: #9BAAC2;
  --line: #2A3A55;
  --accent: #E8EEF8;
  --accent-fg: #0E1726;
  --c-safe: #6FA2FF;
  --c-balance: #3CCBAF;
  --c-growth: #F2B544;
  --c-bold: #FF7A55;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 768px) { body { font-size: 18px; padding-block: 32px 56px; } }
.wrap { max-width: 1120px; margin: 0 auto; }
h1, h2, h3, p, ul { margin: 0; }
h1, h2, .nick { font-family: var(--font-display); font-weight: 400; text-wrap: balance; }
button { touch-action: manipulation; }

.eyebrow { font-size: .8rem; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: clamp(20px, 3.4vw, 36px);
}

/* 버튼 */
.btn {
  font: inherit; font-weight: 600; font-size: 1.15rem;
  min-height: 60px; padding: 14px 36px;
  border: 0; border-radius: 16px; cursor: pointer;
  background: var(--accent); color: var(--accent-fg);
  transition: transform .12s ease, opacity .12s ease;
}
.btn:active { transform: scale(.98); }
:is(.btn, .opt, .back):focus-visible { outline: 3px solid var(--c-safe); outline-offset: 3px; }
@media (hover: hover) { .btn:hover { opacity: .9; } }

/* 게이지 */
.gauge { width: 100%; max-width: 460px; margin: 0 auto; }
.gauge svg { display: block; width: 100%; height: auto; }
.seg { fill: none; stroke-width: 30; transition: opacity .6s ease; }
.s0 { stroke: var(--c-safe); }
.s1 { stroke: var(--c-balance); }
.s2 { stroke: var(--c-growth); }
.s3 { stroke: var(--c-bold); }
.seg.dim { opacity: .28; }
.gtxt { fill: var(--muted); font-size: 15px; font-weight: 600; text-anchor: middle; font-family: var(--font-body); }
.needle {
  transform-origin: 200px 200px; transform-box: view-box;
  transition: transform 1.2s cubic-bezier(.2, .9, .25, 1.12);
}
.needle line { stroke: var(--fg); stroke-width: 6; stroke-linecap: round; }
.hub { fill: var(--fg); }
.needle.idle { transform: rotate(90deg); animation: sway 3.4s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(60deg); } to { transform: rotate(120deg); } }

/* 시작 화면 */
#screen-start { display: grid; gap: 22px; justify-items: center; text-align: center; padding-top: 8px; }
.intro { display: contents; }
.intro .eyebrow { order: 0; }
#screen-start h1 { order: 1; font-size: clamp(2.4rem, 9vw, 3.6rem); line-height: 1.2; }
.visual { order: 2; width: 100%; display: grid; gap: 18px; justify-items: center; }
.lead { order: 3; max-width: 30em; color: var(--muted); font-size: 1.05rem; text-wrap: pretty; }
.meta { order: 4; font-size: .9rem; font-weight: 600; color: var(--muted); }
#btn-start { order: 5; width: min(100%, 380px); font-size: 1.3rem; min-height: 68px; }
.legend { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center; font-weight: 600; font-size: .95rem; }
.legend li { display: flex; align-items: center; gap: 7px; }
.legend i { width: 13px; height: 13px; border-radius: 50%; background: var(--c); }

@media (min-width: 900px) {
  #screen-start {
    grid-template-columns: 1.05fr .95fr; gap: 56px; align-items: center;
    justify-items: start; text-align: left;
    min-height: min(620px, calc(100vh - 140px)); padding-top: 0;
  }
  .intro { display: grid; gap: 22px; justify-items: start; }
  #screen-start h1 { font-size: clamp(3.4rem, 6.2vw, 5.2rem); }
  .lead { font-size: 1.2rem; }
  .visual { order: 0; padding: 36px 32px 28px; }
  #btn-start { width: auto; min-width: 300px; }
}

/* 문제 화면 */
#screen-quiz { display: grid; gap: 18px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.count { font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.count span { color: var(--muted); font-weight: 500; }
.back {
  font: inherit; font-size: 1rem; font-weight: 500; color: var(--muted);
  background: none; border: 0; padding: 10px 10px; min-height: 44px; cursor: pointer; border-radius: 10px;
}
.back[hidden] { display: none; }
@media (hover: hover) { .back:hover { color: var(--fg); } }
.prog { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.prog i { height: 9px; border-radius: 5px; background: var(--line); transition: background .25s ease; }
.prog i.done { background: var(--fg); }
.prog i.now { background: color-mix(in srgb, var(--fg) 40%, var(--line)); }
.qcard { display: grid; gap: 24px; animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.qcard h2 { font-size: clamp(1.5rem, 3.4vw, 2.35rem); line-height: 1.4; max-width: 30em; }
.qcard h2:focus { outline: none; }
.qnote { color: var(--muted); font-size: 1rem; margin-top: -12px; }
.opts { display: grid; gap: 14px; }
.opt {
  display: flex; align-items: flex-start; gap: 16px;
  width: 100%; min-height: 76px; padding: 18px 20px; text-align: left;
  font: inherit; font-size: 1.12rem; line-height: 1.55; color: var(--fg);
  background: var(--surface); border: 2px solid var(--line); border-radius: 16px; cursor: pointer;
  transition: border-color .15s ease, background .15s ease, transform .1s ease;
}
.opt:active { transform: scale(.985); }
@media (hover: hover) { .opt:hover { border-color: var(--fg); } }
.opt.picked { border-color: var(--fg); background: color-mix(in srgb, var(--fg) 7%, var(--surface)); }
.key {
  flex: none; width: 34px; height: 34px; display: grid; place-items: center;
  border: 1.5px solid var(--line); border-radius: 10px;
  font-size: 1rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums;
}
.opt.picked .key { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.txt { min-width: 0; overflow-wrap: anywhere; }
.kbhint { display: none; color: var(--muted); font-size: .9rem; }
@media (pointer: fine) { .kbhint { display: block; } }
@media (min-width: 900px) {
  .opts { grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .opt { flex-direction: column; gap: 20px; min-height: 190px; padding: 22px; font-size: 1.2rem; }
}

/* 결과 화면 */
#screen-result { display: grid; gap: 18px; }
.result { display: grid; gap: 14px; justify-items: start; align-content: start; }
.r-a .gauge { max-width: 400px; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 6px;
  padding: 6px 14px 6px 12px; border-radius: 999px; font-weight: 700; font-size: .95rem;
  background: color-mix(in srgb, var(--tc) 16%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--tc) 45%, var(--surface));
}
.pill i { width: 11px; height: 11px; border-radius: 50%; background: var(--tc); }
.nick { font-size: clamp(2.1rem, 5.4vw, 3.1rem); line-height: 1.2; }
.tag { font-size: 1.12rem; font-weight: 600; text-wrap: balance; }
.result p { text-wrap: pretty; }
.score { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.result h3, .products h3 { font-size: 1.05rem; font-weight: 700; }
.traits { list-style: none; padding: 0; display: grid; gap: 10px; width: 100%; }
.traits li { padding: 14px 16px; border-radius: 14px; background: color-mix(in srgb, var(--tc) 9%, var(--surface)); }
.watch { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px dashed var(--line); }
.watch strong { display: block; font-size: .85rem; color: var(--muted); letter-spacing: .04em; }
.products { display: grid; gap: 4px; align-content: start; }
.products .sub { color: var(--muted); font-size: .95rem; }
.prow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.prow:first-of-type { margin-top: 10px; }
.prow > div:first-child { min-width: 0; }
.prow b { display: block; font-size: 1.08rem; }
.prow span.d { display: block; color: var(--muted); font-size: .92rem; line-height: 1.45; }
.fit { flex: none; display: grid; gap: 5px; justify-items: end; font-size: .82rem; font-weight: 600; color: var(--muted); }
.dots { display: flex; gap: 5px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--tc); }
.note { color: var(--muted); font-size: .98rem; text-wrap: pretty; padding: 0 4px; }
#btn-retry { justify-self: center; width: min(100%, 380px); margin-top: 4px; }
@media (min-width: 900px) {
  #screen-result { grid-template-columns: 1fr 1fr; gap: 20px; }
  .r-a { grid-row: 1 / span 2; }
  .r-b, .r-c { grid-column: 2; }
  .note { grid-column: 1 / -1; text-align: center; }
  #btn-retry { grid-column: 1 / -1; }
}
@media (max-width: 420px) {
  .prow { align-items: flex-start; flex-direction: column; gap: 8px; }
  .fit { justify-items: start; grid-auto-flow: column; align-items: center; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .needle.idle { transform: rotate(90deg); }
}
</style>
</head>
<body>
<main class="wrap">

  <section id="screen-start" aria-labelledby="start-title">
    <div class="intro">
      <p class="eyebrow">금융 수업 시작 전</p>
      <h1 id="start-title">나는 어떤<br>투자자일까?</h1>
      <p class="lead">질문 10개에 답하면 나의 투자 성향을 알 수 있어요. 정답은 없으니 떠오르는 대로 골라 보세요.</p>
      <p class="meta">질문 10개 · 약 3분</p>
      <button class="btn" id="btn-start" type="button">테스트 시작</button>
    </div>
    <div class="visual card">
      <div class="gauge" id="gauge-start"></div>
      <ul class="legend" aria-label="투자 성향 네 가지">
        <li style="--c: var(--c-safe)"><i></i>안정 추구</li>
        <li style="--c: var(--c-balance)"><i></i>균형 추구</li>
        <li style="--c: var(--c-growth)"><i></i>성장 추구</li>
        <li style="--c: var(--c-bold)"><i></i>모험 추구</li>
      </ul>
    </div>
  </section>

  <section id="screen-quiz" aria-label="투자 성향 질문" hidden>
    <div class="top">
      <div class="count" id="count" aria-live="polite"></div>
      <button class="back" id="btn-back" type="button">← 이전 질문</button>
    </div>
    <div class="prog" id="prog" aria-hidden="true"></div>
    <div class="card qcard" id="qcard"></div>
    <p class="kbhint">키보드의 1, 2, 3 키로도 고를 수 있어요.</p>
  </section>

  <section id="screen-result" aria-label="투자 성향 결과" hidden></section>

</main>

<script>
(function () {
  var QUESTIONS = [
    { q: "설날에 세뱃돈 10만 원을 받았어요. 이 돈을 어떻게 할까요?",
      o: [["인기 있는 회사의 주식을 산다. 값이 크게 오를 수도, 떨어질 수도 있다", 3],
          ["은행에 맡겨서 이자를 받는다", 1],
          ["절반은 은행에 맡기고, 절반은 주식에 투자한다", 2]] },
    { q: "친구가 \"이 회사 주식이 곧 2배로 오를 거래!\"라고 말해요. 나는?",
      o: [["확실하지 않은 이야기라서 투자하지 않는다", 1],
          ["직접 알아보고, 괜찮아 보이면 조금만 투자한다", 2],
          ["기회를 놓치기 싫어서 바로 투자한다", 3]] },
    { q: "투자한 돈이 한 달 만에 20% 줄었어요. 나는?",
      o: [["왜 줄었는지 알아보고, 기다릴지 팔지 정한다", 2],
          ["값이 싸졌으니 기회라고 생각하고 더 산다", 3],
          ["더 줄어들기 전에 팔아서 남은 돈을 지킨다", 1]] },
    { q: "다음 중 가장 마음에 드는 선택은?",
      note: "세 가지 모두 평균을 내면 10,000원이에요.",
      o: [["50% 확률로 15,000원, 50% 확률로 5,000원을 받는다", 2],
          ["무조건 10,000원을 받는다", 1],
          ["20% 확률로 50,000원, 80% 확률로 0원을 받는다", 3]] },
    { q: "처음 해 보는 게임을 시작할 때 나는?",
      o: [["설명은 대충 보고 가장 어려운 모드부터 도전한다", 3],
          ["기본 규칙만 익히고 해 보면서 배운다", 2],
          ["설명서를 꼼꼼히 읽고 안전한 방법부터 연습한다", 1]] },
    { q: "돈이 오가는 상황에서 어느 쪽이 더 신경 쓰이나요?",
      o: [["얻는 것과 잃는 것이 비슷하게 신경 쓰인다", 2],
          ["잃는 것이 훨씬 싫다. 조금 덜 벌어도 안전한 게 좋다", 1],
          ["크게 얻을 수 있다면 잃을 위험은 감수할 수 있다", 3]] },
    { q: "올해 안에 20만 원짜리 물건을 사려고 해요. 지금 가진 돈은 10만 원이에요. 어떻게 할까요?",
      o: [["매달 꾸준히 저금해서 확실하게 모은다", 1],
          ["수익이 큰 곳에 투자해서 한 번에 불려 본다. 실패하면 못 살 수도 있다", 3],
          ["저금도 하고, 일부는 수익이 날 만한 곳에 투자한다", 2]] },
    { q: "내가 투자한 회사의 주가가 하루에도 크게 오르락내리락해요. 내 마음은?",
      o: [["짜릿하고 재미있다. 움직임이 클수록 기회가 많다", 3],
          ["불안해서 계속 신경 쓰인다. 마음이 편한 게 더 중요하다", 1],
          ["신경은 쓰이지만 길게 보고 기다릴 수 있다", 2]] },
    { q: "문구점에 뽑기가 있어요. 1,000원을 내면 큰 상품이 나올 수도 있지만 꽝일 수도 있어요. 나는?",
      o: [["한두 번만 해 보고 그만한다", 2],
          ["큰 상품을 노리고 여러 번 도전해 본다", 3],
          ["꽝이 나올 수 있으니 하지 않고 그 돈으로 간식을 산다", 1]] },
    { q: "친구들이 각자 다른 방법으로 돈을 모았어요. 가장 멋져 보이는 친구는?",
      o: [["꾸준히 저금해서 한 푼도 잃지 않고 모은 친구", 1],
          ["저금과 투자를 함께 해서 조금씩 꾸준히 늘린 친구", 2],
          ["위험을 감수하고 투자해서 몇 배로 불린 친구", 3]] }
  ];

  var TYPES = [
    { name: "안정 추구형", nick: "든든한 금고지기", min: 10, max: 14, color: "var(--c-safe)",
      tag: "잃지 않는 것이 먼저예요.",
      desc: "돈이 줄어드는 상황이 가장 불편한 유형이에요. 조금 천천히 늘어나더라도 원금이 지켜지는 방법을 좋아해요.",
      traits: ["계획을 세우고 꾸준히 모으는 데 강해요", "확실하지 않은 소문에 쉽게 흔들리지 않아요", "마음이 편한 선택을 중요하게 생각해요"],
      watch: "너무 안전한 것만 찾다 보면 시간이 지나도 돈이 많이 늘지 않을 수 있어요.",
      fit: [3, 2, 1] },
    { name: "균형 추구형", nick: "균형 잡는 설계자", min: 15, max: 19, color: "var(--c-balance)",
      tag: "안전과 수익 사이에서 중심을 잡아요.",
      desc: "한쪽으로 치우치기보다 나누어 준비하는 유형이에요. 위험은 줄이고 기회는 놓치지 않으려고 해요.",
      traits: ["알아본 다음에 결정해요", "돈을 나누어 관리하는 것을 좋아해요", "손실이 나도 이유를 따져 보며 침착해요"],
      watch: "고민이 너무 길어지면 좋은 때를 놓칠 수 있어요.",
      fit: [2, 3, 2] },
    { name: "성장 추구형", nick: "기회를 노리는 탐험가", min: 20, max: 24, color: "var(--c-growth)",
      tag: "약간의 위험은 더 큰 수익을 위한 비용이라고 생각해요.",
      desc: "새로운 기회에 관심이 많고 가격이 출렁여도 어느 정도 버틸 수 있는 유형이에요. 목표가 생기면 적극적으로 움직여요.",
      traits: ["새로운 투자 기회에 관심이 많아요", "가격이 오르내려도 어느 정도 기다릴 수 있어요", "목표를 정하면 적극적으로 행동해요"],
      watch: "확실한 근거 없이 남을 따라 하면 손실이 커질 수 있어요.",
      fit: [1, 2, 3] },
    { name: "모험 추구형", nick: "두려움 없는 도전자", min: 25, max: 30, color: "var(--c-bold)",
      tag: "크게 얻을 수 있다면 도전해 볼래요.",
      desc: "큰 수익의 가능성에 마음이 끌리는 유형이에요. 가격이 크게 변하는 상황도 즐기고, 빠르게 결정해요.",
      traits: ["큰 수익이 날 가능성에 끌려요", "가격이 크게 변해도 즐길 수 있어요", "결정이 빠르고 행동으로 옮겨요"],
      watch: "한꺼번에 많이 걸면 큰 손실이 날 수 있어요. 나누어서 투자하는 습관이 필요해요.",
      fit: [1, 1, 3] }
  ];

  var PRODUCTS = [
    { n: "예금·적금", d: "원금을 지키면서 정해진 이자를 받아요" },
    { n: "채권", d: "나라나 회사에 돈을 빌려주고 이자를 받아요" },
    { n: "주식", d: "값이 크게 오르내려서 큰 수익도 큰 손실도 가능해요" }
  ];
  var FIT_LABEL = { 1: "덜 맞아요", 2: "보통이에요", 3: "잘 맞아요" };

  var $ = function (id) { return document.getElementById(id); };
  var screens = { start: $("screen-start"), quiz: $("screen-quiz"), result: $("screen-result") };
  var answers = [];
  var idx = 0;
  var locked = false;
  var timer = null;

  function show(name) {
    Object.keys(screens).forEach(function (k) { screens[k].hidden = (k !== name); });
    window.scrollTo(0, 0);
  }

  /* 게이지 (안정 → 모험, 네 구간) */
  function gaugeSVG() {
    var R = 150, cx = 200, cy = 200;
    function pt(a) {
      var r = a * Math.PI / 180;
      return [cx - R * Math.cos(r), cy - R * Math.sin(r)];
    }
    var segs = "";
    for (var i = 0; i < 4; i++) {
      var p0 = pt(i * 45 + 2), p1 = pt((i + 1) * 45 - 2);
      segs += '<path class="seg s' + i + '" d="M' + p0[0].toFixed(2) + " " + p0[1].toFixed(2) +
              " A" + R + " " + R + " 0 0 1 " + p1[0].toFixed(2) + " " + p1[1].toFixed(2) + '"/>';
    }
    return '<svg viewBox="0 0 400 244" role="img" aria-label="안정에서 모험까지 이어지는 투자 성향 게이지">' +
      segs +
      '<text class="gtxt" x="50" y="234">안정</text><text class="gtxt" x="350" y="234">모험</text>' +
      '<g class="needle"><line x1="200" y1="200" x2="84" y2="200"/></g>' +
      '<circle class="hub" cx="200" cy="200" r="12"/></svg>';
  }

  /* 점수 → 성향 */
  function typeIndex(score) {
    for (var i = 0; i < TYPES.length; i++) {
      if (score >= TYPES[i].min && score <= TYPES[i].max) return i;
    }
    return TYPES.length - 1;
  }
  function needleAngle(score, ti) {
    var t = TYPES[ti];
    var frac = (score - t.min + 0.5) / (t.max - t.min + 1);
    return ti * 45 + 4 + frac * 37;
  }
  function total() {
    return answers.reduce(function (a, b) { return a + b; }, 0);
  }

  /* 시작 화면 */
  $("gauge-start").innerHTML = gaugeSVG();
  $("gauge-start").querySelector(".needle").classList.add("idle");

  /* 질문 화면 */
  var prog = $("prog");
  for (var p = 0; p < QUESTIONS.length; p++) prog.appendChild(document.createElement("i"));

  function renderQuestion() {
    var Q = QUESTIONS[idx];
    $("count").innerHTML = "질문 " + (idx + 1) + ' <span>/ ' + QUESTIONS.length + "</span>";
    $("btn-back").hidden = (idx === 0);
    Array.prototype.forEach.call(prog.children, function (el, i) {
      el.className = i < idx ? "done" : (i === idx ? "now" : "");
    });
    var html = '<h2 tabindex="-1" id="qtitle">' + Q.q + "</h2>";
    if (Q.note) html += '<p class="qnote">' + Q.note + "</p>";
    html += '<div class="opts" role="group" aria-labelledby="qtitle">';
    Q.o.forEach(function (o, i) {
      var picked = answers[idx] !== undefined && answers[idx] === o[1];
      html += '<button type="button" class="opt' + (picked ? " picked" : "") + '" data-i="' + i + '">' +
              '<span class="key">' + (i + 1) + '</span><span class="txt">' + o[0] + "</span></button>";
    });
    html += "</div>";
    var card = $("qcard");
    card.style.animation = "none";
    card.innerHTML = html;
    void card.offsetWidth;
    card.style.animation = "";
    locked = false;
    $("qtitle").focus({ preventScroll: true });
  }

  function choose(i) {
    if (locked) return;
    locked = true;
    var o = QUESTIONS[idx].o[i];
    answers[idx] = o[1];
    var btns = $("qcard").querySelectorAll(".opt");
    Array.prototype.forEach.call(btns, function (b, k) { b.classList.toggle("picked", k === i); });
    timer = setTimeout(function () {
      if (idx < QUESTIONS.length - 1) { idx++; renderQuestion(); }
      else { renderResult(); }
    }, 340);
  }

  $("qcard").addEventListener("click", function (e) {
    var b = e.target.closest(".opt");
    if (b) choose(Number(b.getAttribute("data-i")));
  });
  $("btn-back").addEventListener("click", function () {
    if (idx === 0) return;
    clearTimeout(timer);
    idx--;
    renderQuestion();
  });
  document.addEventListener("keydown", function (e) {
    if (screens.quiz.hidden) return;
    if (e.key >= "1" && e.key <= "3") choose(Number(e.key) - 1);
  });

  function start() {
    clearTimeout(timer);
    answers = [];
    idx = 0;
    show("quiz");
    renderQuestion();
  }
  $("btn-start").addEventListener("click", start);

  /* 결과 화면 */
  function renderResult() {
    var score = total();
    var ti = typeIndex(score);
    var t = TYPES[ti];
    var style = ' style="--tc:' + t.color + '"';
    var html =
      '<div class="card result r-a"' + style + ">" +
        '<p class="eyebrow">나의 투자 성향은</p>' +
        '<div class="gauge" id="gauge-result">' + gaugeSVG() + "</div>" +
        '<p class="pill"><i></i>' + t.name + "</p>" +
        '<h2 class="nick">' + t.nick + "</h2>" +
        '<p class="tag">' + t.tag + "</p>" +
        "<p>" + t.desc + "</p>" +
        '<p class="score">내 점수 ' + score + " / 30점</p>" +
      "</div>" +
      '<div class="card result r-b"' + style + ">" +
        "<h3>이런 특징이 있어요</h3>" +
        '<ul class="traits">' + t.traits.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>" +
        '<p class="watch"><strong>조심할 점</strong>' + t.watch + "</p>" +
      "</div>" +
      '<div class="card products r-c"' + style + ">" +
        "<h3>어울리는 금융 상품</h3>" +
        '<p class="sub">앞으로 배울 상품이 내 성향과 얼마나 맞는지 살펴봐요.</p>' +
        PRODUCTS.map(function (pr, k) {
          var lv = t.fit[k], dots = "";
          for (var d = 1; d <= 3; d++) dots += '<i class="' + (d <= lv ? "on" : "") + '"></i>';
          return '<div class="prow"><div><b>' + pr.n + '</b><span class="d">' + pr.d + "</span></div>" +
                 '<div class="fit"><div class="dots" role="img" aria-label="' + FIT_LABEL[lv] + '">' + dots +
                 "</div><span>" + FIT_LABEL[lv] + "</span></div></div>";
        }).join("") +
      "</div>" +
      '<p class="note">투자 성향에는 정답이 없어요. 어떤 성향이든 장점과 조심할 점이 있어요. 금융 상품의 특징을 배우면서 내 성향과 비교해 보세요.</p>' +
      '<button class="btn" id="btn-retry" type="button">다시 해보기</button>';
    screens.result.innerHTML = html;
    show("result");

    var g = $("gauge-result");
    Array.prototype.forEach.call(g.querySelectorAll(".seg"), function (s, i) {
      s.classList.toggle("dim", i !== ti);
    });
    var needle = g.querySelector(".needle");
    needle.style.transform = "rotate(0deg)";
    void needle.getBoundingClientRect();
    requestAnimationFrame(function () {
      needle.style.transform = "rotate(" + needleAngle(score, ti).toFixed(1) + "deg)";
    });
    $("btn-retry").addEventListener("click", start);
  }
})();
</script>
</body>
</html>
